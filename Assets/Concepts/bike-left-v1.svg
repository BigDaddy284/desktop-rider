<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!-- Desktop Rider concept: bike, left side. Drawn from the owner's reference photographs. Not approved artwork. -->
  <defs>
    <style>
      .o { stroke:#1b1b1f; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .t { stroke:#1b1b1f; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
      .num { font-family:'DejaVu Sans','Arial Black',Impact,sans-serif; font-weight:900; fill:#1b1b1f; }
    </style>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cfd6dd"/><stop offset="1" stop-color="#8d98a3"/>
    </linearGradient>
    <linearGradient id="alloy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef1f4"/><stop offset="1" stop-color="#aeb6bf"/>
    </linearGradient>
    <g id="wheel">
      <circle r="100" fill="#26262b" class="o"/>
      <circle r="104" fill="none" stroke="#1b1b1f" stroke-width="12" stroke-dasharray="9 7.34"/>
      <circle r="107" fill="none" stroke="#1b1b1f" stroke-width="3" stroke-dasharray="15 9.2" transform="scale(1.075)" opacity="0"/>
      <circle r="70" fill="#f7f8fa" class="t"/>
      <circle r="63" fill="#3a3a40" class="t"/>
      <circle r="57" fill="#f4f5f7"/>
      <g stroke="#b8c0c9" stroke-width="2.5">
        <path d="M0-57L8 0M0 57L-8 0M57 0L0 8M-57 0L0-8M40-40L-4 6M-40 40L4-6M40 40L-6-4M-40-40L6 4M22-53L-8 3M-22 53L8-3M53 22L-3-8M-53-22L3 8M53-22L-3 8M-53 22L3-8M22 53L-8-3M-22-53L8 3"/>
      </g>
    </g>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="480" cy="648" rx="400" ry="14" fill="#000" opacity="0.14"/>

  <!-- rear wheel -->
  <g transform="translate(795,520) scale(1.12)"><use href="#wheel"/></g>
  <circle cx="795" cy="520" r="44" fill="#2a2a2f" class="t"/>
  <circle cx="795" cy="520" r="44" fill="none" stroke="#1b1b1f" stroke-width="6" stroke-dasharray="5 6"/>
  <circle cx="795" cy="520" r="20" fill="#e0a030" class="t"/>

  <!-- chain -->
  <path d="M575 505 L790 566" fill="none" stroke="#7a6a3a" stroke-width="6" stroke-dasharray="6 4" stroke-linecap="round"/>

  <!-- swingarm -->
  <path class="o" fill="#f47b20" d="M560 445 L600 430 L800 500 Q818 510 812 530 Q806 542 790 540 L580 485 Q552 470 560 445Z"/>
  <path class="t" fill="#f0399a" d="M640 458 L770 502 L765 520 L632 482Z"/>
  <circle cx="798" cy="520" r="9" fill="#cfd6dd" class="t"/>

  <!-- rear shock -->
