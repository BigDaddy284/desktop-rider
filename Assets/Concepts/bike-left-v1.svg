    <path class="o" fill="#ffffff" d="M250 146 L326 146 Q334 148 332 158 L322 248 Q318 262 304 262 L272 262 Q258 262 254 248 L244 158 Q242 148 250 146Z"/>
    <path fill="#f0399a" d="M250 150 L326 150 L324 168 L252 168Z"/>
    <rect x="258" y="155" width="60" height="8" rx="2" fill="#6ec6ea"/>
    <path fill="#6ec6ea" d="M262 250 L314 250 L318 238 L258 238Z"/>
